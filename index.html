const DATA_URL='https://raw.githubusercontent.com/rgthr/Hanzi-HSK/935c9a7580e08663a69682c1c004209b688bc88f/index.html',KEY='hanzi_v1_state',DK='hanzi_hsk1_dataset_v1';let ALL=[],byH={},board=[],focusSet=[],filter='all',writer=null,strokeC=null;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let state=Object.assign({skills:{},seen:{},mastered:{},theme:'system',audio:true,board:[],learnedSinceQuiz:0},JSON.parse(localStorage.getItem(KEY)||'{}'));const save=()=>localStorage.setItem(KEY,JSON.stringify(state));

function sk(h){return state.skills[h]||(state.skills[h]={recognition:0,meaning:0,sound:0,writing:0,exposures:0,mistakes:0,last:0,due:0})}function lvl(c){let s=sk(c.h);if(state.mastered[c.h])return'mastered';if(state.seen[c.h])return'learning';return'new'}function mastery(c){let s=sk(c.h);if(s.recognition>=3&&s.meaning>=3)state.mastered[c.h]=1}function bump(c,f,ok){let s=sk(c.h);state.seen[c.h]=1;s.exposures++;s.last=Date.now();if(ok)s[f]=Math.min(5,(s[f]||0)+1);else s.mistakes++;mastery(c);save();progress()}function exposure(c){let s=sk(c.h);if(!state.seen[c.h]){state.seen[c.h]=1;state.learnedSinceQuiz=(state.learnedSinceQuiz||0)+1}s.exposures++;s.last=Date.now();save();progress()}

const EX={'一':['我有一个朋友。','wǒ yǒu yí ge péngyou','I have a friend.'],'人':['这里人很多。','zhèlǐ rén hěn duō','There are many people here.'],'大':['北京很大。','Běijīng hěn dà','Beijing is very big.'],'小':['这个房间很小。','zhège fángjiān hěn xiǎo','This room is small.'],'我':['我是学生。','wǒ shì xuésheng','I am a student.'],'你':['你好吗？','nǐ hǎo ma','How are you?'],'好':['今天天气很好。','jīntiān tiānqì hěn hǎo','The weather is very nice today.'],'是':['他是老师。','tā shì lǎoshī','He is a teacher.'],'不':['我不喝咖啡。','wǒ bù hē kāfēi','I don’t drink coffee.'],'有':['我有一个问题。','wǒ yǒu yí ge wèntí','I have a question.'],'在':['我在家。','wǒ zài jiā','I am at home.'],'学':['我在学汉语。','wǒ zài xué Hànyǔ','I am learning Chinese.'],'吃':['我们去吃饭吧。','wǒmen qù chīfàn ba','Let’s go eat.'],'喝':['我想喝水。','wǒ xiǎng hē shuǐ','I want to drink water.'],'看':['我晚上看书。','wǒ wǎnshang kàn shū','I read in the evening.'],'说':['你会说汉语吗？','nǐ huì shuō Hànyǔ ma','Can you speak Chinese?'],'想':['我想去中国。','wǒ xiǎng qù Zhōngguó','I want to go to China.'],'去':['明天我去北京。','míngtiān wǒ qù Běijīng','Tomorrow I’m going to Beijing.'],'来':['你什么时候来？','nǐ shénme shíhou lái','When are you coming?'],'水':['请给我一杯水。','qǐng gěi wǒ yì bēi shuǐ','Please give me a glass of water.']};function example(c){if(EX[c.h])return EX[c.h];if(c.context&&c.context!==c.h)return[c.context,c.contextPinyin,c.contextMeaning];return[`我认识“${c.h}”。`,`wǒ rènshi “${c.p}”`,`I recognize ${c.h}.`]}
const MEM={'好':'女 (woman) + 子 (child). A very old character; use the two visible parts as the memory hook for “good”.','休':'亻 (person) + 木 (tree): picture a person leaning against a tree to rest.','明':'日 (sun) + 月 (moon): two bright celestial bodies → “bright”.','林':'Two 木 (trees) together → a grove or woods.','森':'Three 木 (trees) intensify the idea → forest / dense with trees.','看':'手 (hand) above 目 (eye): picture shading your eyes with your hand to look.','问':'门 (door) around 口 (mouth): a mouth at the door asking a question.','妈':'女 gives the meaning area; 马 is mainly the sound clue in 妈 (mā).','吗':'口 signals speech/question; 马 supplies the sound mā.','想':'相 above 心 (heart/mind). 心 is the semantic clue: thinking happens in the mind.','您':'你 + 心 underneath; the 心 visually helps distinguish the respectful “you”.','家':'宀 (roof) marks the home/house idea. The lower component is 豕, historically “pig”.','人':'Originally a pictograph of a standing person viewed from the side.','山':'An ancient pictograph of mountain peaks; its silhouette is still easy to see.','口':'A pictograph of an open mouth; it often appears in characters connected to speaking or the mouth.','日':'Originally a drawing of the sun. It also means “day” and appears in many time-related characters.','月':'Originally a crescent moon pictograph. As a component it can also represent 肉 “flesh”, so context matters.','木':'A pictograph of a tree, with trunk, branches and roots. It recurs in many plant/wood characters.','女':'An ancient pictograph of a kneeling woman. Learn its modern shape; avoid treating historical social interpretations as literal definitions.','子':'An ancient pictograph of a child. It appears both for meaning and as a component in other characters.'};function memory(c){if(MEM[c.h])return MEM[c.h];if(c.note&&c.note!=='整体字形')return c.note;return'Focus on the overall silhouette first. Component and historical notes will appear when they give you a genuinely useful memory hook.'}
function page(c,i){let ex=example(c),fam=(c.family||[]).filter(h=>byH[h]);return`<div class="fp" data-i="${i}" data-h="${c.h}"><div class="card"><div class="cHead">HSK 1 · ${c.index}/${ALL.length}</div><div class="heroChar"><div class="big">${c.h}</div><div class="py">${c.p}</div><div class="meaning">${c.contextMeaning}</div><button class="audio" data-speak>🔊</button></div><div class="learnBody"><div class="duo"><div class="box example"><div class="lab">In a sentence</div><div class="exCn">${ex[0]}</div><div class="exPy">${ex[1]}</div><div class="exEn">${ex[2]}</div></div><div class="box"><div class="lab">Related shapes</div>${fam.length?`<div class="family">${fam.map(h=>`<button data-family="${h}">${h}</button>`).join('')}</div>`:'<div class="none">Related forms appear here as you meet them.</div>'}</div></div><div class="memory"><div class="lab">Remember it</div><b>Key / context · </b>${memory(c)}</div><div class="bottomRow"><button class="stroke" data-stroke>✍️ Practice stroke order</button><span class="swipe">← swipe →</span></div><div class="dots">${focusSet.map((_,j)=>j===i?'●':'○').join('')}</div></div></div></div>`}
function openFocus(set,start=0){focusSet=[...set];$('#pager').innerHTML=focusSet.map(page).join('');$('#focus').classList.add('on');bindFocus();requestAnimationFrame(()=>{$('#pager').scrollLeft=$('#pager').clientWidth*start;visit(start)})}function visit(i){i=Math.max(0,Math.min(i,focusSet.length-1));$('#count').textContent=`${i+1} of ${focusSet.length}`;let c=focusSet[i];if(c&&!state.seen[c.h]){exposure(c);renderBoard();if(state.learnedSinceQuiz>=6)setTimeout(offerQuiz,350)}}function bindFocus(){let p=$('#pager'),last=-1;p.onscroll=()=>{let i=Math.round(p.scrollLeft/p.clientWidth);if(i!==last){last=i;visit(i)}};$$('.fp').forEach(x=>{let c=byH[x.dataset.h];x.querySelector('[data-speak]').onclick=()=>speak(c);x.querySelector('[data-stroke]').onclick=()=>openStroke(c);x.querySelectorAll('[data-family]').forEach(b=>b.onclick=()=>openFocus([byH[b.dataset.family]],0))})}function closeFocus(){$('#focus').classList.remove('on');progress();renderBoard()}
function speak(c){if(!state.audio)return;let u=new SpeechSynthesisUtterance(c.h);u.lang='zh-CN';u.rate=.72;speechSynthesis.cancel();speechSynthesis.speak(u);bump(c,'sound',true)}function progress(){if(!ALL.length)return;let m=ALL.filter(c=>state.mastered[c.h]).length,s=ALL.filter(c=>state.seen[c.h]).length,l=ALL.filter(c=>state.seen[c.h]&&!state.mastered[c.h]).length,p=Math.round(m/ALL.length*100);$('#pCount').textContent=`${m} / ${ALL.length} mastered`;$('#pBar').style.width=p+'%';$('#mStat').textContent=m;$('#lStat').textContent=l;$('#sStat').textContent=s;$('#pctStat').textContent=p+'%';$('#mapBar').style.width=p+'%'}
function explore(){let q=$('#search').value.trim().toLowerCase(),a=ALL.filter(c=>(filter==='all'||lvl(c)===filter)&&(!q||c.h.includes(q)||c.p.toLowerCase().includes(q)||c.contextMeaning.toLowerCase().includes(q)));$('#wall').innerHTML=a.map(c=>`<button class="wt" data-w="${c.h}">${c.h}</button>`).join('');$$('[data-w]').forEach(b=>b.onclick=()=>openFocus([byH[b.dataset.w]],0))}function show(n){$$('.screen').forEach(s=>s.classList.toggle('on',s.id===n+'Screen'));$$('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.screen===n));if(n==='explore')explore();if(n==='progress')progress()}
function applyTheme(){let t=state.theme;if(t==='system')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;$$('[data-theme]').forEach(b=>b.classList.toggle('on',b.dataset.theme===state.theme));$$('[data-audio]').forEach(b=>b.classList.toggle('on',(b.dataset.audio==='on')===state.audio))}function openStroke(c){strokeC=c;$('#strokeHz').textContent=c.h;$('#strokePy').textContent=c.p+' · '+c.contextMeaning;$('#strokePane').classList.add('on');requestAnimationFrame(()=>strokeQuiz(c))}function strokeQuiz(c){let t=$('#target'),box=t.parentElement;t.innerHTML='';if(typeof HanziWriter==='undefined'){ $('#strokeStatus').textContent='Stroke data needs internet.';return}let z=Math.floor(box.clientWidth);writer=HanziWriter.create(t,c.h,{width:z,height:z,padding:26,showOutline:true,showCharacter:false});$('#strokeStatus').textContent='Start with the first stroke.';writer.quiz({showHintAfterMisses:1,onCorrectStroke:d=>$('#strokeStatus').textContent=d.strokesRemaining?`${d.strokesRemaining} strokes left`:'Finishing…',onComplete:()=>{$('#strokeStatus').textContent='Character complete ✓';bump(c,'writing',true)}})}function offerQuiz(){if($('#quiz').classList.contains('on'))return;$('#quizCard').innerHTML='<h2>Quick check?</h2><p>You’ve met six new characters. Want four quick questions to reinforce them?</p><div class="quizActions"><button id="noQuiz">Not now</button><button class="primary" id="yesQuiz">Start quiz</button></div>';$('#quiz').classList.add('on');$('#noQuiz').onclick=()=>{state.learnedSinceQuiz=0;save();$('#quiz').classList.remove('on')};$('#yesQuiz').onclick=()=>runQuiz(0,ALL.filter(c=>state.seen[c.h]).slice(-6).sort(()=>Math.random()-.5).slice(0,4))}function runQuiz(i,set){if(i>=set.length){state.learnedSinceQuiz=0;save();$('#quizCard').innerHTML='<h2>Done ✓</h2><div class="quizActions"><button class="primary" id="qdone">Keep learning</button></div>';$('#qdone').onclick=()=>$('#quiz').classList.remove('on');return}let c=set[i],opts=[c,...ALL.filter(x=>x.h!==c.h).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);$('#quizCard').innerHTML=`<p>${i+1} of ${set.length} · What does this mean?</p><div class="qchar">${c.h}</div><div class="choices">${opts.map(x=>`<button data-ok="${x.h===c.h}">${x.contextMeaning}</button>`).join('')}</div><div class="quizActions"><button id="stopq">Stop quiz</button></div>`;$$('[data-ok]').forEach(b=>b.onclick=()=>{let ok=b.dataset.ok==='true';b.classList.add(ok?'good':'bad');bump(c,'meaning',ok);bump(c,'recognition',ok);setTimeout(()=>runQuiz(i+1,set),500)});$('#stopq').onclick=()=>{$('#quiz').classList.remove('on');state.learnedSinceQuiz=0;save()}}
function init(){applyTheme();makeBoard();progress();explore()}$$('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.screen));$('#mix').onclick=()=>makeBoard(true);$('#continue').onclick=()=>openFocus(board,0);$('#close').onclick=closeFocus;$('#settings').onclick=$('#fMenu').onclick=()=>$('#settingsSheet').classList.add('on');$('#doneSettings').onclick=()=>$('#settingsSheet').classList.remove('on');$$('[data-theme]').forEach(b=>b.onclick=()=>{state.theme=b.dataset.theme;save();applyTheme()});$$('[data-audio]').forEach(b=>b.onclick=()=>{state.audio=b.dataset.audio==='on';save();applyTheme()});$$('.chip').forEach(b=>b.onclick=()=>{$$('.chip').forEach(x=>x.classList.toggle('on',x===b));filter=b.dataset.filter;explore()});$('#search').oninput=explore;$('#closeStroke').onclick=()=>{$('#strokePane').classList.remove('on');$('#target').innerHTML=''};$('#retry').onclick=()=>strokeC&&strokeQuiz(strokeC);$('#watch').onclick=()=>{if(!strokeC)return;let t=$('#target'),z=Math.floor(t.parentElement.clientWidth);t.innerHTML='';writer=HanziWriter.create(t,strokeC.h,{width:z,height:z,padding:26,showOutline:true,showCharacter:true});writer.animateCharacter()};data();
</script></body></html>
