<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Hanzi</title></head><body><script>
(async()=>{
const SRC='https://raw.githubusercontent.com/rgthr/Hanzi-HSK/e698539aeb8a6fd1ed30120db80b6008ff820a4b/index.html';
const CSSPATCH=`
/* interaction hotfix */
.stroke:before{content:none!important}
.stroke{cursor:pointer!important}
.sentenceNext{cursor:pointer!important;touch-action:manipulation!important}
`;
const JSPATCH=`
// iOS interaction hotfix: use pointerup so taps work reliably even inside swipe containers.
(function(){
  function cycleSentence(btn){
    const fp=btn.closest('.fp');
    if(!fp)return;
    const c=byH[fp.dataset.h];
    if(!c)return;
    let list=[];
    if(typeof examples==='function') list=examples(c)||[];
    if((!list||!list.length)&&typeof example==='function') list=[example(c)];
    if(!list||list.length<2)return;
    const wrap=fp.querySelector('.sentenceExample');
    if(!wrap)return;
    const n=(Number(wrap.dataset.sentenceIndex||0)+1)%list.length;
    const ex=list[n];
    wrap.dataset.sentenceIndex=n;
    const cn=wrap.querySelector('.exCn'),py=wrap.querySelector('.exPy'),en=wrap.querySelector('.exEn');
    if(cn)cn.textContent=ex[0];
    if(py)py.textContent=ex[1];
    if(en)en.textContent=ex[2];
    if(wrap.animate)wrap.animate([{opacity:.45,transform:'translateY(3px)'},{opacity:1,transform:'translateY(0)'}],{duration:180,easing:'ease-out'});
    if(btn.animate)btn.animate([{transform:'rotate(0deg)'},{transform:'rotate(180deg)'}],{duration:220,easing:'ease-out'});
  }
  function openPractice(btn){
    const fp=btn.closest('.fp');
    if(!fp)return;
    const c=byH[fp.dataset.h];
    if(!c)return;
    if(btn.animate)btn.animate([{transform:'scale(1)'},{transform:'scale(.985)'},{transform:'scale(1)'}],{duration:160,easing:'ease-out'});
    openStroke(c);
  }
  document.addEventListener('pointerup',function(e){
    const sentence=e.target.closest&&e.target.closest('[data-next-sentence]');
    if(sentence){e.preventDefault();cycleSentence(sentence);return}
    const stroke=e.target.closest&&e.target.closest('[data-stroke]');
    if(stroke){e.preventDefault();openPractice(stroke);return}
  },{capture:true,passive:false});
})();
`;
let w=await fetch(SRC).then(r=>r.text());
function extendConst(name,patch){
  const re=new RegExp('const '+name+'=("(?:\\\\.|[^"\\\\])*");');
  w=w.replace(re,(m,s)=>'const '+name+'='+JSON.stringify(JSON.parse(s)+patch)+';');
}
extendConst('FIXCSS',CSSPATCH);
extendConst('FIXJS',JSPATCH);
document.open();document.write(w);document.close();
})().catch(e=>document.body.innerHTML='<div style="font-family:system-ui;padding:32px">Could not load Hanzi. Please reconnect and reopen the app.</div>');
</script></body></html>
