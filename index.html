<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Hanzi</title></head><body><script>
(async()=>{
const SRC="https://raw.githubusercontent.com/rgthr/Hanzi-HSK/b440db3b9edb1c4c81c672cb93d4cd898df84900/index.html";
const FIXCSS="\n/* polished interactions + inline quiz cards */\n.family{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:9px!important}\n.family button{min-width:0!important;min-height:74px!important;height:auto!important;padding:9px 11px!important;grid-template-columns:auto 1fr!important;grid-template-rows:auto auto!important;border-radius:10px!important;transition:transform .16s ease,background .16s ease,border-color .16s ease!important}\n.family button .fh{font-size:40px!important}.family button .fpinyin{font-size:15px!important}.family button .fmeaning{font-size:13px!important;max-width:none!important;white-space:normal!important;overflow:visible!important;text-overflow:clip!important}\n.stroke{margin-top:10px!important;min-height:70px!important;height:auto!important;border-radius:10px!important;background:var(--greenSoft)!important;border-color:color-mix(in srgb,var(--green) 22%,var(--line))!important;font-size:15px!important;font-weight:700!important;padding:12px 14px!important;transition:transform .16s ease,background .16s ease!important}.stroke:before{content:'✍️';font-size:21px;margin-right:10px}.stroke:after{content:'›';font-size:24px;color:var(--muted)}\n.sentenceNext{transition:transform .18s ease,background .18s ease!important}.tile{transition:transform .16s cubic-bezier(.2,.8,.2,1),background .16s ease,box-shadow .16s ease!important}.tile.fxTap{transform:scale(.975)!important;box-shadow:0 1px 2px rgba(15,15,15,.03)!important}.board.fxLeft{animation:boardLeft .22s ease}.board.fxRight{animation:boardRight .22s ease}@keyframes boardLeft{0%{opacity:.72;transform:translateX(10px)}100%{opacity:1;transform:translateX(0)}}@keyframes boardRight{0%{opacity:.72;transform:translateX(-10px)}100%{opacity:1;transform:translateX(0)}}.fp.fxSettle .card{animation:focusSettle .2s ease}@keyframes focusSettle{0%{transform:scale(.992);opacity:.82}100%{transform:scale(1);opacity:1}}\n.quizNudge{display:none!important}\n.quizSlide .card{justify-content:stretch}.quizTop{height:25px;padding:8px 15px 0;text-align:right;font-size:10px;color:var(--muted);letter-spacing:.05em}.quizBody{flex:1;display:flex;flex-direction:column;padding:22px 18px 18px;min-height:0}.quizEyebrow{font-size:11px;color:var(--muted);font-weight:650;margin-bottom:12px}.quizPrompt{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.25}.quizHero{min-height:190px;display:grid;place-items:center;text-align:center}.quizHero.char{font-family:'Songti SC','STSong',serif;font-size:128px;line-height:1}.quizHero.word{font-size:38px;font-weight:760;letter-spacing:-.035em;line-height:1.1;padding:20px}.quizChoices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quizChoice{min-height:58px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 10px;font-size:15px;font-weight:650;transition:transform .14s ease,background .14s ease,border-color .14s ease}.quizChoice.charChoice{font-family:'Songti SC','STSong',serif;font-size:34px}.quizChoice:active{transform:scale(.98)}.quizChoice.correct{background:var(--greenSoft);border-color:color-mix(in srgb,var(--green) 45%,var(--line));color:var(--green)}.quizChoice.wrong{background:color-mix(in srgb,#c94d3f 9%,var(--paper));border-color:color-mix(in srgb,#c94d3f 38%,var(--line))}.quizChoice.dim{opacity:.45}.quizFeedback{margin-top:12px;border-top:1px solid var(--line);padding-top:13px;display:none;align-items:center;gap:12px}.quizFeedback.on{display:flex;animation:feedbackIn .2s ease}@keyframes feedbackIn{0%{opacity:0;transform:translateY(4px)}100%{opacity:1;transform:translateY(0)}}.feedbackMark{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--greenSoft);color:var(--green);font-size:19px;font-weight:800;flex:none}.feedbackMark.bad{background:color-mix(in srgb,#c94d3f 10%,var(--paper));color:#b23e34}.feedbackChar{font-family:'Songti SC','STSong',serif;font-size:42px;line-height:1}.feedbackText{min-width:0}.feedbackText b{display:block;font-size:17px}.feedbackText span{display:block;font-size:13px;color:var(--muted);margin-top:2px}.quizHint{margin-top:auto;text-align:center;color:var(--muted);font-size:11px;padding-top:10px;min-height:25px}\n@media(max-height:820px){.family button{min-height:62px!important;padding:6px 8px!important}.family button .fh{font-size:33px!important}.stroke{min-height:58px!important;margin-top:7px!important;padding:8px 12px!important}.quizHero{min-height:145px}.quizHero.char{font-size:105px}.quizHero.word{font-size:32px}.quizBody{padding-top:14px}}\n";
const FIXJS="\n// Interaction reliability + visual polish + inline quiz-card flow\nwindow.__hanziViewed = new Set();\nwindow.__quizAdded = false;\nwindow.__quizQuestions = [];\nwindow.__quizCurrent = -1;\nconst __oldOpenFocus = openFocus;\nopenFocus = function(set,start=0){window.__hanziViewed=new Set();window.__quizAdded=false;window.__quizQuestions=[];window.__quizCurrent=-1;return __oldOpenFocus(set,start)};\nfunction __shuffle(a){return [...a].sort(()=>Math.random()-.5)}\nfunction __mainQuizChars(){return focusSet.slice(0,6).filter(Boolean)}\nfunction __makeQuizQuestions(){const mains=__mainQuizChars();if(mains.length<4)return[];const chosen=__shuffle(mains).slice(0,4);return chosen.map((c,i)=>({c,type:i%2===0?'meaning':'character',answered:false}))}\nfunction __choicePool(c,count=3){const mains=__mainQuizChars().filter(x=>x.h!==c.h&&x.contextMeaning!==c.contextMeaning),extra=ALL.filter(x=>x.h!==c.h&&x.contextMeaning!==c.contextMeaning&&!mains.some(m=>m.h===x.h));return __shuffle([...mains,...extra]).slice(0,count)}\nfunction __quizSlide(q,qi){const opts=__shuffle([q.c,...__choicePool(q.c,3)]),askMeaning=q.type==='meaning';return `<div class=\"fp quizSlide\" data-quiz-index=\"${qi}\"><div class=\"card\"><div class=\"quizTop\">TEST · ${qi+1}/4</div><div class=\"quizBody\"><div class=\"quizEyebrow\">Quick check</div><div class=\"quizPrompt\">${askMeaning?'What does this character mean?':'How do you write this in Chinese?'}</div><div class=\"quizHero ${askMeaning?'char':'word'}\">${askMeaning?q.c.h:q.c.contextMeaning}</div><div class=\"quizChoices\">${opts.map(x=>`<button class=\"quizChoice ${askMeaning?'':'charChoice'}\" data-quiz-choice=\"${x.h}\" data-correct=\"${x.h===q.c.h}\">${askMeaning?x.contextMeaning:x.h}</button>`).join('')}</div><div class=\"quizFeedback\"><div class=\"feedbackMark\"></div><div class=\"feedbackChar\">${q.c.h}</div><div class=\"feedbackText\"><b>${q.c.p}</b><span>${q.c.contextMeaning}</span></div></div><div class=\"quizHint\">Choose an answer</div></div></div></div>`}\nfunction __bindQuizSlides(){document.querySelectorAll('.quizSlide').forEach(slide=>{slide.querySelectorAll('[data-quiz-choice]').forEach(btn=>btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(slide.dataset.answered==='1')return;slide.dataset.answered='1';const qi=Number(slide.dataset.quizIndex),q=window.__quizQuestions[qi],ok=btn.dataset.correct==='true';q.answered=true;slide.querySelectorAll('[data-quiz-choice]').forEach(b=>{if(b.dataset.correct==='true')b.classList.add('correct');else if(b===btn)b.classList.add('wrong');else b.classList.add('dim')});const fb=slide.querySelector('.quizFeedback'),mark=fb.querySelector('.feedbackMark');mark.textContent=ok?'✓':'×';if(!ok)mark.classList.add('bad');fb.classList.add('on');slide.querySelector('.quizHint').textContent=qi===window.__quizQuestions.length-1?'Swipe either way for the next 6':'Swipe either way for the next question';let s=sk(q.c.h);state.seen[q.c.h]=1;s.exposures++;s.last=Date.now();if(ok){s.meaning=Math.min(5,(s.meaning||0)+1);s.recognition=Math.min(5,(s.recognition||0)+1)}else s.mistakes++;mastery(q.c);save();progress();if(slide.animate)slide.querySelector('.card').animate([{transform:'scale(.995)'},{transform:'scale(1)'}],{duration:180,easing:'ease-out'})}));let sx=0,sy=0;slide.addEventListener('touchstart',e=>{if(e.touches[0]){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});slide.addEventListener('touchend',e=>{if(!e.changedTouches[0]||slide.dataset.answered!=='1')return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)<45||Math.abs(dx)<Math.abs(dy)*1.15)return;const qi=Number(slide.dataset.quizIndex),p=document.querySelector('#pager');if(qi<window.__quizQuestions.length-1){const nextIndex=focusSet.length+qi+1;requestAnimationFrame(()=>p.scrollTo({left:p.clientWidth*nextIndex,behavior:'smooth'}))}else setTimeout(()=>{closeFocus();nextBoard()},90)},{passive:true})})}\nfunction __ensureQuizSlides(){if(window.__quizAdded||focusSet.length<6)return;window.__quizAdded=true;window.__quizQuestions=__makeQuizQuestions();const p=document.querySelector('#pager');if(!p||!window.__quizQuestions.length)return;p.insertAdjacentHTML('beforeend',window.__quizQuestions.map(__quizSlide).join(''));__bindQuizSlides()}\nshowQuizNudge=function(){__ensureQuizSlides()};const __qn=document.querySelector('#quizNudge');if(__qn)__qn.style.display='none';\nconst __oldVisit=visit;\nvisit=function(i){__oldVisit(i);if(i>=focusSet.length){const qi=i-focusSet.length;window.__quizCurrent=qi;const count=document.querySelector('#count');if(count)count.textContent=`Test ${Math.min(qi+1,4)} of 4`;return}const c=focusSet[i];if(c){window.__hanziViewed.add(c.h);const page=document.querySelector('.fp[data-i=\"'+i+'\"]');if(page){page.classList.remove('fxSettle');void page.offsetWidth;page.classList.add('fxSettle')}}if(window.__hanziViewed.size>=Math.min(6,focusSet.length)&&focusSet.length>=6)__ensureQuizSlides()};\ndocument.addEventListener('click',function(e){const next=e.target.closest('[data-next-sentence]');if(next){e.preventDefault();e.stopImmediatePropagation();const fp=next.closest('.fp');if(!fp)return;const c=byH[fp.dataset.h],list=examples(c);if(!list||list.length<2)return;const wrap=fp.querySelector('.sentenceExample');if(!wrap)return;const n=(Number(wrap.dataset.sentenceIndex||0)+1)%list.length,ex=list[n];wrap.dataset.sentenceIndex=n;wrap.querySelector('.exCn').textContent=ex[0];wrap.querySelector('.exPy').textContent=ex[1];wrap.querySelector('.exEn').textContent=ex[2];if(wrap.animate)wrap.animate([{opacity:.45,transform:'translateY(3px)'},{opacity:1,transform:'translateY(0)'}],{duration:180,easing:'ease-out'});if(next.animate)next.animate([{transform:'rotate(0deg)'},{transform:'rotate(180deg)'}],{duration:220,easing:'ease-out'});return}const stroke=e.target.closest('[data-stroke]');if(stroke){e.preventDefault();e.stopImmediatePropagation();const fp=stroke.closest('.fp');if(!fp)return;const c=byH[fp.dataset.h];if(stroke.animate)stroke.animate([{transform:'scale(1)'},{transform:'scale(.985)'},{transform:'scale(1)'}],{duration:180,easing:'ease-out'});if(c)openStroke(c);return}},true);\ndocument.addEventListener('pointerdown',function(e){const tile=e.target.closest('.tile');if(tile){tile.classList.add('fxTap');const clear=()=>tile.classList.remove('fxTap');tile.addEventListener('pointerup',clear,{once:true});tile.addEventListener('pointercancel',clear,{once:true});setTimeout(clear,240)}},true);\nconst __board=document.querySelector('#board');if(__board){let sx=0,sy=0;__board.addEventListener('touchstart',e=>{if(e.touches[0]){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});__board.addEventListener('touchend',e=>{if(!e.changedTouches[0])return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.25){requestAnimationFrame(()=>{__board.classList.remove('fxLeft','fxRight');void __board.offsetWidth;__board.classList.add(dx<0?'fxLeft':'fxRight')})}},{passive:true})}\n";
let w=await fetch(SRC).then(r=>r.text());
const marker="const d=s=>decodeURIComponent(escape(atob(s)));";
w=w.replace(marker,marker+"\nconst FIXCSS="+JSON.stringify(FIXCSS)+";\nconst FIXJS="+JSON.stringify(FIXJS)+";");
w=w.replace("document.open();document.write(t);document.close();","t=t.replace('</style>',FIXCSS+'</style>');t=t.replace('<\\/script>',FIXJS+'<\\/script>');document.open();document.write(t);document.close();");
document.open();document.write(w);document.close();
})().catch(e=>document.body.innerHTML='<div style="font-family:system-ui;padding:32px">Could not load Hanzi. Please reconnect and reopen the app.</div>');
</script></body></html>
