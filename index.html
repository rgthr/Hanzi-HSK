<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Hanzi</title></head><body><script>
(async()=>{
const SRC="https://raw.githubusercontent.com/rgthr/Hanzi-HSK/b440db3b9edb1c4c81c672cb93d4cd898df84900/index.html";
const FIXCSS="\n/* polish + larger related shapes + larger stroke practice */\n.family{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}\n.family button{min-width:0!important;min-height:66px!important;height:auto!important;padding:8px 10px!important;grid-template-columns:auto 1fr!important;grid-template-rows:auto auto!important;border-radius:10px!important;transition:transform .16s ease,background .16s ease,border-color .16s ease!important}\n.family button .fh{font-size:36px!important}\n.family button .fpinyin{font-size:14px!important}\n.family button .fmeaning{font-size:12px!important;max-width:none!important;white-space:normal!important;overflow:visible!important;text-overflow:clip!important}\n.stroke{margin-top:10px!important;height:62px!important;border-radius:10px!important;background:var(--greenSoft)!important;border-color:color-mix(in srgb,var(--green) 22%,var(--line))!important;font-size:14px!important;font-weight:700!important;padding:0 14px!important;transition:transform .16s ease,background .16s ease!important}\n.stroke:before{content:'✍️';font-size:19px;margin-right:9px}\n.stroke:after{content:'›';font-size:22px;color:var(--muted)}\n.sentenceNext{transition:transform .18s ease,background .18s ease!important}\n.tile{transition:transform .16s cubic-bezier(.2,.8,.2,1),background .16s ease,box-shadow .16s ease!important}\n.tile.fxTap{transform:scale(.975)!important;box-shadow:0 1px 2px rgba(15,15,15,.03)!important}\n.board.fxLeft{animation:boardLeft .22s ease}\n.board.fxRight{animation:boardRight .22s ease}\n@keyframes boardLeft{0%{opacity:.72;transform:translateX(10px)}100%{opacity:1;transform:translateX(0)}}\n@keyframes boardRight{0%{opacity:.72;transform:translateX(-10px)}100%{opacity:1;transform:translateX(0)}}\n.fp.fxSettle .card{animation:focusSettle .2s ease}\n@keyframes focusSettle{0%{transform:scale(.992);opacity:.82}100%{transform:scale(1);opacity:1}}\n@media(max-height:820px){\n .family button{min-height:58px!important;padding:6px 8px!important}\n .family button .fh{font-size:31px!important}\n .stroke{height:54px!important;margin-top:7px!important}\n}\n";
const FIXJS="\n// Interaction reliability + visual polish patch\nwindow.__hanziViewed = new Set();\nwindow.__hanziNudgeDismissed = false;\n\nconst __oldOpenFocus = openFocus;\nopenFocus = function(set,start=0){\n  window.__hanziViewed = new Set();\n  window.__hanziNudgeDismissed = false;\n  return __oldOpenFocus(set,start);\n};\n\nconst __oldVisit = visit;\nvisit = function(i){\n  __oldVisit(i);\n  const c = focusSet[i];\n  if(c){\n    window.__hanziViewed.add(c.h);\n    const page = document.querySelector('.fp[data-i=\"'+i+'\"]');\n    if(page){\n      page.classList.remove('fxSettle');\n      void page.offsetWidth;\n      page.classList.add('fxSettle');\n    }\n  }\n  // Six cards viewed = starting card + five swipes. Show before the user hits a dead edge.\n  if(window.__hanziViewed.size >= Math.min(6, focusSet.length) && focusSet.length >= 6 && !window.__hanziNudgeDismissed){\n    showQuizNudge();\n  }\n};\n\ndocument.addEventListener('click', function(e){\n  const next = e.target.closest('[data-next-sentence]');\n  if(next){\n    e.preventDefault();\n    e.stopImmediatePropagation();\n    const fp = next.closest('.fp');\n    if(!fp) return;\n    const c = byH[fp.dataset.h];\n    const list = examples(c);\n    if(!list || list.length < 2) return;\n    const wrap = fp.querySelector('.sentenceExample');\n    if(!wrap) return;\n    const cur = Number(wrap.dataset.sentenceIndex || 0);\n    const n = (cur + 1) % list.length;\n    const ex = list[n];\n    wrap.dataset.sentenceIndex = n;\n    wrap.querySelector('.exCn').textContent = ex[0];\n    wrap.querySelector('.exPy').textContent = ex[1];\n    wrap.querySelector('.exEn').textContent = ex[2];\n    if(wrap.animate) wrap.animate(\n      [{opacity:.45,transform:'translateY(3px)'},{opacity:1,transform:'translateY(0)'}],\n      {duration:180,easing:'ease-out'}\n    );\n    if(next.animate) next.animate(\n      [{transform:'rotate(0deg)'},{transform:'rotate(180deg)'}],\n      {duration:220,easing:'ease-out'}\n    );\n    return;\n  }\n\n  const stroke = e.target.closest('[data-stroke]');\n  if(stroke){\n    e.preventDefault();\n    e.stopImmediatePropagation();\n    const fp = stroke.closest('.fp');\n    if(!fp) return;\n    const c = byH[fp.dataset.h];\n    if(stroke.animate) stroke.animate(\n      [{transform:'scale(1)'},{transform:'scale(.985)'},{transform:'scale(1)'}],\n      {duration:180,easing:'ease-out'}\n    );\n    if(c) openStroke(c);\n    return;\n  }\n}, true);\n\ndocument.addEventListener('pointerdown', function(e){\n  const tile=e.target.closest('.tile');\n  if(tile){\n    tile.classList.add('fxTap');\n    const clear=()=>tile.classList.remove('fxTap');\n    tile.addEventListener('pointerup',clear,{once:true});\n    tile.addEventListener('pointercancel',clear,{once:true});\n    setTimeout(clear,240);\n  }\n}, true);\n\nconst __board = document.querySelector('#board');\nif(__board){\n  let sx=0, sy=0;\n  __board.addEventListener('touchstart',e=>{\n    if(!e.touches[0]) return;\n    sx=e.touches[0].clientX; sy=e.touches[0].clientY;\n  },{passive:true});\n  __board.addEventListener('touchend',e=>{\n    if(!e.changedTouches[0]) return;\n    const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;\n    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.25){\n      requestAnimationFrame(()=>{\n        __board.classList.remove('fxLeft','fxRight');\n        void __board.offsetWidth;\n        __board.classList.add(dx<0?'fxLeft':'fxRight');\n      });\n    }\n  },{passive:true});\n}\n\nconst __dismiss=document.querySelector('#nudgeDismiss');\nif(__dismiss) __dismiss.addEventListener('click',()=>{window.__hanziNudgeDismissed=true});\n\nrequestAnimationFrame(()=>{\n  const copy=document.querySelector('#quizNudge .copy span');\n  if(copy) copy.textContent='You’ve seen all 6. Test now, or keep swiping back through them.';\n});\n";
let w=await fetch(SRC).then(r=>r.text());
const marker="const d=s=>decodeURIComponent(escape(atob(s)));";
w=w.replace(marker,marker+"\nconst FIXCSS="+JSON.stringify(FIXCSS)+";\nconst FIXJS="+JSON.stringify(FIXJS)+";");
w=w.replace("document.open();document.write(t);document.close();","t=t.replace('</style>',FIXCSS+'</style>');t=t.replace('<\\/script>',FIXJS+'<\\/script>');document.open();document.write(t);document.close();");
document.open();document.write(w);document.close();
})().catch(e=>document.body.innerHTML='<div style="font-family:system-ui;padding:32px">Could not load Hanzi. Please reconnect and reopen the app.</div>');
</script></body></html>
