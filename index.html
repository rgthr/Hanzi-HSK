<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>Hanzi HSK</title>
  <style>
    :root{
      --bg:#0b1020;--panel:#121a2e;--panel2:#18233d;--text:#f8fafc;--muted:#94a3b8;
      --accent:#60a5fa;--good:#34d399;--warn:#fbbf24;--danger:#fb7185;--line:#24324f;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:linear-gradient(180deg,#09111f,#0b1020 28%,#0d1324);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;min-height:100%}
    body{padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
    button{font:inherit}
    .app{max-width:760px;margin:0 auto}
    .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
    h1{font-size:30px;line-height:1;margin:0 0 6px;letter-spacing:-.04em}
    .sub{color:var(--muted);font-size:14px}
    .pill{border:1px solid var(--line);background:#0f172a;color:#dbeafe;padding:9px 12px;border-radius:999px;font-size:13px}
    .progressCard{background:rgba(18,26,46,.92);border:1px solid var(--line);border-radius:20px;padding:14px 15px;margin-bottom:14px}
    .progressTop{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:9px}
    .progressBar{height:9px;background:#0b1222;border-radius:999px;overflow:hidden}
    .progressFill{height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#818cf8);transition:width .35s ease}
    .sessionInfo{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px;color:var(--muted);font-size:12px}
    .sessionInfo span{background:#0d1528;border:1px solid var(--line);padding:6px 8px;border-radius:999px}
    .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:14px;min-height:220px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 24px rgba(0,0,0,.18);position:relative;overflow:hidden}
    .card.review::after,.card.new::after{position:absolute;right:10px;top:10px;font-size:10px;padding:4px 7px;border-radius:999px;border:1px solid var(--line)}
    .card.review::after{content:"REVIEW";color:#fde68a;background:#3a2a0d}
    .card.new::after{content:"NEW";color:#bfdbfe;background:#112c4e}
    .hanzi{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;font-size:64px;line-height:1;text-align:center;margin-top:22px}
    .pinyin{text-align:center;font-size:17px;color:#bfdbfe;margin-top:7px}
    .meaning{text-align:center;font-size:15px;font-weight:650;margin-top:3px}
    .context{border-top:1px solid var(--line);padding-top:10px;margin-top:12px;font-size:12px;line-height:1.4;color:#cbd5e1}
    .context b{color:#f8fafc}
    .strokes{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
    .strokeDot{width:8px;height:8px;border-radius:50%;background:#334155}
    .strokeDot.on{background:#60a5fa}
    .actions{display:flex;gap:10px;margin-top:14px}
    .btn{flex:1;border:0;border-radius:15px;padding:14px 12px;font-weight:700}
    .secondary{background:#172033;color:#dbeafe;border:1px solid var(--line)}
    .primary{background:#e2e8f0;color:#0f172a}
    .lessonPicker{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin-bottom:10px;scrollbar-width:none}
    .lessonPicker::-webkit-scrollbar{display:none}
    .lessonBtn{white-space:nowrap;border:1px solid var(--line);background:#0e1628;color:#cbd5e1;border-radius:999px;padding:8px 11px}
    .lessonBtn.active{background:#dbeafe;color:#0f172a;border-color:#dbeafe}
    .footerNote{color:#64748b;font-size:11px;text-align:center;margin:16px 0 4px}
    @media (min-width:640px){.cards{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <h1>Hanzi HSK</h1>
      <div class="sub">6-card sessions · new characters + spaced review</div>
    </div>
    <button class="pill" id="resetBtn">Reset</button>
  </div>

  <div class="progressCard">
    <div class="progressTop">
      <strong id="lessonTitle">Lesson 1</strong>
      <span id="overallText">0 learned</span>
    </div>
    <div class="progressBar"><div class="progressFill" id="progressFill"></div></div>
    <div class="sessionInfo">
      <span id="sessionMix">4 new · 2 review</span>
      <span id="streakText">0 day streak</span>
      <span id="masteryText">0% mastery</span>
    </div>
  </div>

  <div class="lessonPicker" id="lessonPicker"></div>
  <div class="cards" id="cards"></div>

  <div class="actions">
    <button class="btn secondary" id="againBtn">Review again</button>
    <button class="btn primary" id="nextBtn">Next 6 cards</button>
  </div>

  <div class="footerNote">Progress is saved locally on this iPhone.</div>
</div>

<script>
const lessons = [
  [
    ["你","nǐ","you","你好","nǐ hǎo","hello","7"],
    ["好","hǎo","good","很好","hěn hǎo","very good","6"],
    ["我","wǒ","I / me","我是…","wǒ shì…","I am…","7"],
    ["是","shì","to be","我是学生","wǒ shì xuésheng","I am a student","9"],
    ["不","bù","not","不是","bú shì","is not","4"],
    ["人","rén","person","中国人","Zhōngguó rén","Chinese person","2"],
    ["大","dà","big","很大","hěn dà","very big","3"],
    ["小","xiǎo","small","很小","hěn xiǎo","very small","3"]
  ],
  [
    ["一","yī","one","一个人","yí ge rén","one person","1"],
    ["二","èr","two","二月","èr yuè","February","2"],
    ["三","sān","three","三个人","sān ge rén","three people","3"],
    ["四","sì","four","四点","sì diǎn","four o'clock","5"],
    ["五","wǔ","five","五月","wǔ yuè","May","4"],
    ["六","liù","six","六点","liù diǎn","six o'clock","4"],
    ["七","qī","seven","七天","qī tiān","seven days","2"],
    ["八","bā","eight","八月","bā yuè","August","2"]
  ],
  [
    ["九","jiǔ","nine","九点","jiǔ diǎn","nine o'clock","2"],
    ["十","shí","ten","十个人","shí ge rén","ten people","2"],
    ["百","bǎi","hundred","一百","yì bǎi","one hundred","6"],
    ["个","gè","general measure word","一个","yí ge","one (item/person)","3"],
    ["这","zhè","this","这个","zhè ge","this one","7"],
    ["那","nà","that","那个","nà ge","that one","6"],
    ["哪","nǎ","which","哪个","nǎ ge","which one","9"],
    ["谁","shéi","who","他是谁？","tā shì shéi?","Who is he?","10"]
  ],
  [
    ["他","tā","he / him","他很好","tā hěn hǎo","he is well","5"],
    ["她","tā","she / her","她是谁？","tā shì shéi?","Who is she?","6"],
    ["们","men","plural suffix","我们","wǒmen","we / us","5"],
    ["的","de","possessive particle","我的","wǒ de","mine / my","8"],
    ["有","yǒu","to have","我有…","wǒ yǒu…","I have…","6"],
    ["没","méi","not have / not","没有","méiyǒu","do not have","7"],
    ["在","zài","at / in","我在家","wǒ zài jiā","I am at home","6"],
    ["家","jiā","home / family","在家","zài jiā","at home","10"]
  ],
  [
    ["中","zhōng","middle / China","中国","Zhōngguó","China","4"],
    ["国","guó","country","中国","Zhōngguó","China","8"],
    ["学","xué","study / learn","学习","xuéxí","to study","8"],
    ["生","shēng","life / student","学生","xuésheng","student","5"],
    ["老","lǎo","old","老师","lǎoshī","teacher","6"],
    ["师","shī","teacher / master","老师","lǎoshī","teacher","6"],
    ["朋","péng","friend (part)","朋友","péngyou","friend","8"],
    ["友","yǒu","friend","朋友","péngyou","friend","4"]
  ],
  [
    ["吃","chī","eat","吃饭","chī fàn","eat a meal","6"],
    ["喝","hē","drink","喝水","hē shuǐ","drink water","12"],
    ["水","shuǐ","water","喝水","hē shuǐ","drink water","4"],
    ["茶","chá","tea","喝茶","hē chá","drink tea","9"],
    ["饭","fàn","meal / rice","吃饭","chī fàn","eat a meal","7"],
    ["菜","cài","dish / vegetable","中国菜","Zhōngguó cài","Chinese food","11"],
    ["米","mǐ","rice / meter","米饭","mǐfàn","cooked rice","6"],
    ["果","guǒ","fruit / result","水果","shuǐguǒ","fruit","8"]
  ],
  [
    ["今","jīn","today / current","今天","jīntiān","today","4"],
    ["天","tiān","day / sky","今天","jīntiān","today","4"],
    ["明","míng","bright / next","明天","míngtiān","tomorrow","8"],
    ["昨","zuó","yesterday","昨天","zuótiān","yesterday","9"],
    ["年","nián","year","今年","jīnnián","this year","6"],
    ["月","yuè","month / moon","这个月","zhè ge yuè","this month","4"],
    ["日","rì","day / sun","生日","shēngrì","birthday","4"],
    ["点","diǎn","o'clock / point","三点","sān diǎn","3 o'clock","9"]
  ],
  [
    ["去","qù","go","去学校","qù xuéxiào","go to school","5"],
    ["来","lái","come","来中国","lái Zhōngguó","come to China","7"],
    ["看","kàn","look / watch","看书","kàn shū","read a book","9"],
    ["听","tīng","listen","听音乐","tīng yīnyuè","listen to music","7"],
    ["说","shuō","speak / say","说中文","shuō Zhōngwén","speak Chinese","9"],
    ["读","dú","read","读书","dú shū","read / study","10"],
    ["写","xiě","write","写汉字","xiě Hànzì","write Chinese characters","5"],
    ["做","zuò","do / make","做饭","zuò fàn","cook","11"]
  ]
];

const state = JSON.parse(localStorage.getItem("hanziState")||'{"lesson":0,"seen":{},"mastered":{},"streak":0,"lastDay":""}');
let currentCards = [];

function save(){ localStorage.setItem("hanziState",JSON.stringify(state)); }

function dayKey(){ return new Date().toISOString().slice(0,10); }

function updateStreak(){
  const today=dayKey();
  if(state.lastDay===today) return;
  if(state.lastDay){
    const prev=new Date(state.lastDay+"T00:00:00");
    const now=new Date(today+"T00:00:00");
    const diff=Math.round((now-prev)/86400000);
    state.streak = diff===1 ? state.streak+1 : 1;
  } else state.streak=1;
  state.lastDay=today; save();
}

function allChars(){ return lessons.flat(); }

function chooseCards(){
  const poolNew = lessons[state.lesson].filter(x=>!state.seen[x[0]]);
  const reviewPool = allChars().filter(x=>state.seen[x[0]] && !state.mastered[x[0]]);
  const masteredReview = allChars().filter(x=>state.mastered[x[0]]);
  const cards=[];
  const shuffled = a => [...a].sort(()=>Math.random()-.5);

  cards.push(...shuffled(poolNew).slice(0,4));
  cards.push(...shuffled(reviewPool).slice(0,2));

  if(cards.length<6) cards.push(...shuffled(poolNew.filter(x=>!cards.includes(x))).slice(0,6-cards.length));
  if(cards.length<6) cards.push(...shuffled(masteredReview.filter(x=>!cards.includes(x))).slice(0,6-cards.length));
  if(cards.length<6) cards.push(...shuffled(allChars().filter(x=>!cards.includes(x))).slice(0,6-cards.length));

  currentCards = cards.slice(0,6);
  currentCards.forEach(c=>state.seen[c[0]]=true);
  save();
  render();
}

function renderLessons(){
  const wrap=document.getElementById("lessonPicker");
  wrap.innerHTML="";
  lessons.forEach((_,i)=>{
    const b=document.createElement("button");
    b.className="lessonBtn"+(i===state.lesson?" active":"");
    b.textContent="Lesson "+(i+1);
    b.onclick=()=>{state.lesson=i;save();chooseCards();renderLessons();};
    wrap.appendChild(b);
  });
}

function render(){
  renderLessons();
  const cardsEl=document.getElementById("cards");
  cardsEl.innerHTML="";
  currentCards.forEach(c=>{
    const isNew = !state.mastered[c[0]];
    const div=document.createElement("div");
    div.className="card "+(isNew?"new":"review");
    const strokeCount=Math.max(1,parseInt(c[6]||"6"));
    div.innerHTML=`
      <div>
        <div class="hanzi">${c[0]}</div>
        <div class="pinyin">${c[1]}</div>
        <div class="meaning">${c[2]}</div>
      </div>
      <div class="context"><b>${c[3]}</b><br>${c[4]} · ${c[5]}
        <div class="strokes">${Array.from({length:Math.min(strokeCount,14)},(_,i)=>`<span class="strokeDot ${i===0?"on":""}"></span>`).join("")}</div>
      </div>`;
    div.onclick=()=>{
      state.mastered[c[0]] = !state.mastered[c[0]];
      save(); renderProgress(); div.style.transform="scale(.98)"; setTimeout(()=>div.style.transform="",120);
    };
    cardsEl.appendChild(div);
  });
  renderProgress();
}

function renderProgress(){
  const total=allChars().length;
  const mastered=Object.keys(state.mastered).filter(k=>state.mastered[k]).length;
  const seen=Object.keys(state.seen).length;
  document.getElementById("overallText").textContent=`${seen} seen · ${mastered} mastered`;
  document.getElementById("progressFill").style.width=`${Math.round((mastered/total)*100)}%`;
  document.getElementById("lessonTitle").textContent=`Lesson ${state.lesson+1}`;
  document.getElementById("streakText").textContent=`${state.streak} day streak`;
  document.getElementById("masteryText").textContent=`${Math.round((mastered/total)*100)}% mastery`;
  const n=currentCards.filter(c=>!state.mastered[c[0]]).length;
  document.getElementById("sessionMix").textContent=`${n} learning · ${6-n} review`;
}

document.getElementById("nextBtn").onclick=()=>{ updateStreak(); chooseCards(); };
document.getElementById("againBtn").onclick=()=>render();
document.getElementById("resetBtn").onclick=()=>{
  if(confirm("Reset all saved progress on this iPhone?")){
    localStorage.removeItem("hanziState"); location.reload();
  }
};

updateStreak();
chooseCards();
</script>
</body>
</html>
