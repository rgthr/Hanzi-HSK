<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Hanzi Preview</title></head><body><script>(async()=>{const REF='clean-consolidation';const BASE='https://cdn.jsdelivr.net/gh/rgthr/Hanzi-HSK@'+REF+'/';const BUILD='preview-'+Date.now();const r=await fetch(BASE+'core.html?b='+BUILD,{cache:'no-store'});if(!r.ok)throw new Error('core');let t=await r.text();const files=['patch.js','ui-fix.js','learning-flow.js','stroke-ui.js','stroke-engine-v8.js','polish-v9.js','related-compact-v12.js','sentence-quality-v15.js','app-v26.js','interaction-v29.js','quiz-practice-v30.js','lesson-ux-v32.js'];const tags=files.map(f=>'<script src="'+BASE+f+'?b='+BUILD+'"><\/script>').join('');t=t.replace('</body>',tags+'</body>');document.open();document.write(t);document.close()})().catch(e=>document.body.innerHTML='<div style="font-family:system-ui;padding:32px">Could not load Hanzi preview.<br><small>'+String(e)+'</small></div>');</script></body></html>
