<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Hanzi Consolidated Preview</title></head><body><script>(async()=>{const REF='clean-consolidation';const BASE='https://cdn.jsdelivr.net/gh/rgthr/Hanzi-HSK@'+REF+'/';const BUILD='CONSOLIDATED-1.0.0-'+Date.now();const r=await fetch(BASE+'core.html?b='+BUILD,{cache:'no-store'});if(!r.ok)throw new Error('core');let t=await r.text();t=t.replace('</head>','<link rel="stylesheet" href="'+BASE+'consolidated.css?b='+BUILD+'"></head>');t=t.replace('</body>','<script src="'+BASE+'consolidated-app.js?b='+BUILD+'"><\/script></body>');document.open();document.write(t);document.close()})().catch(e=>document.body.innerHTML='<div style="font-family:system-ui;padding:32px">Could not load Hanzi consolidated preview.<br><small>'+String(e)+'</small></div>');</script></body></html>
