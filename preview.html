<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Hanzi Consolidated Preview</title></head><body><script>(async()=>{const BASE='https://raw.githubusercontent.com/rgthr/Hanzi-HSK/clean-consolidation/';const bust='?b='+Date.now();const get=async f=>{const r=await fetch(BASE+f+bust,{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);return r.text()};let [shell,css,state,app]=await Promise.all([get('consolidated-shell.html'),get('consolidated.css'),get('consolidated-state.js'),get('consolidated-app.js')]);const stateTag='<script src="./consolidated-state.js"><'+'/script>';const appTag='<script src="./consolidated-app.js"><'+'/script>';shell=shell.replace('<link rel="stylesheet" href="./consolidated.css">','').replace(stateTag,'').replace(appTag,'');shell=shell.replace('</head>','<style>'+css+'</style></head>');const injected='<script>'+state+'<'+'/script><script>'+app+'<'+'/script>';shell=shell.replace('</body>',injected+'</body>');document.open();document.write(shell);document.close()})().catch(e=>document.body.innerHTML='<div style="font-family:system-ui;padding:32px">Could not load Hanzi consolidated preview.<br><small>'+String(e)+'</small></div>');</script></body></html>
