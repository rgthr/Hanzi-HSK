<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#191919">
<title>Hanzi · Consolidated</title>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.3/dist/hanzi-writer.min.js"></script>
<script>
/* Force a thick Hanzi Writer brush at construction time for both practice + quiz. */
(()=>{const create=HanziWriter.create.bind(HanziWriter);HanziWriter.create=(el,ch,opts={})=>create(el,ch,{...opts,drawingWidth:72})})();
</script>
<link rel="stylesheet" href="./consolidated.css?v=2.3.2">
<style>
.filters .chip[data-filter="new"]{border:2px solid transparent;background:linear-gradient(var(--paper),var(--paper)) padding-box,linear-gradient(135deg,#d9dee7,#eef1f5) border-box}
.filters .chip[data-filter="learning"]{border:2px solid transparent;background:linear-gradient(var(--paper),var(--paper)) padding-box,linear-gradient(135deg,var(--blue1),var(--blue2),var(--blue3)) border-box}
.filters .chip[data-filter="mastered"]{border:2px solid transparent;background:linear-gradient(var(--paper),var(--paper)) padding-box,linear-gradient(135deg,#15803d,#22c55e,#86efac) border-box}
.filters .chip[data-filter="struggle"]{border:2px solid transparent;background:linear-gradient(var(--paper),var(--paper)) padding-box,linear-gradient(135deg,var(--pink1),var(--pink2),var(--pink3)) border-box}
.filters .chip.on{box-shadow:inset 0 0 0 1px var(--ink);font-weight:750}
.hanziBrushOverlay{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none;overflow:visible}
.hanziBrushOverlay polyline{fill:none;stroke:var(--ink);stroke-width:20;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><b>汉字</b>Hanzi <span class="consolidated-badge">Consolidated</span></div>
    <button class="round" id="settings" aria-label="Settings">•••</button>
  </header>

  <section id="learnScreen" class="screen learn on">
    <div class="hero"><small>HSK 1 · ADAPTIVE CHARACTER LEARNING</small><h1>See the shape.<br>Build the memory.</h1></div>
    <div class="prog"><div class="prow"><b id="pLabel">Starting HSK 1</b><span id="pCount"></span></div><div class="bar"><i id="pBar"></i></div></div>
    <div id="board" class="board" aria-label="Current lesson"></div>
    <div id="lessonDots" class="lessonDeckDots" aria-hidden="true"></div>
    <div class="foot"><button class="btn primary" id="continue">Continue learning</button></div>
  </section>

  <section id="progressScreen" class="screen page">
    <h1 class="title">Progress</h1>
    <div class="stats">
      <div class="stat"><b id="mStat">0</b><span>mastered</span></div>
      <div class="stat"><b id="lStat">0</b><span>learning</span></div>
      <div class="stat"><b id="sStat">0</b><span>seen</span></div>
      <div class="stat"><b id="pctStat">0%</b><span>HSK 1 mastery</span></div>
    </div>
    <div class="map"><b>HSK 1 path</b><div class="bar"><i id="mapBar"></i></div></div>
  </section>

  <section id="exploreScreen" class="screen page scroll">
    <h1 class="title">Explore</h1>
    <input id="search" class="search" placeholder="Search character, pinyin or meaning">
    <div class="filters" aria-label="Character status legend and filters">
      <button class="chip on" data-filter="all">All</button>
      <button class="chip" data-filter="new">Unseen</button>
      <button class="chip" data-filter="learning">Learning</button>
      <button class="chip" data-filter="mastered">Mastered</button>
      <button class="chip" data-filter="struggle">Needs work</button>
    </div>
    <div id="wall" class="wall"></div>
  </section>
</div>

<nav class="nav">
  <button class="on" data-screen="learn"><b>学</b>Learn</button>
  <button data-screen="progress"><b>进</b>Progress</button>
  <button data-screen="explore"><b>览</b>Explore</button>
</nav>

<div id="focus" class="focus" aria-hidden="true">
  <div class="fTop"><button class="round" id="close" aria-label="Close">⌄</button><span id="count" class="count"></span><button class="round" id="fMenu" aria-label="Settings">•••</button></div>
  <div id="pager" class="pager"></div>
</div>

<div id="settingsSheet" class="sheet">
  <div class="sheetCard">
    <h2>Settings</h2>
    <div class="setting"><b>Appearance</b><div class="seg"><button data-theme="system">System</button><button data-theme="light">Light</button><button data-theme="dark">Dark</button></div></div>
    <div class="setting"><b>Audio</b><div class="seg"><button data-audio="on">On</button><button data-audio="off">Silent</button></div></div>
    <div class="setting versionRow"><b>Version</b><span id="buildVersion">Consolidated</span></div>
    <button class="btn" id="doneSettings">Done</button>
  </div>
</div>

<div id="strokePane" class="strokePane">
  <div class="strokeCard">
    <div class="strokeTop"><div><div id="strokeHz" class="sh"></div><b id="strokePy"></b></div><button id="closeStroke" aria-label="Close">×</button></div>
    <h2>Practice stroke order</h2>
    <div class="canvas"><div id="target" class="target"></div></div>
    <div id="strokeStatus" class="strokeStatus"></div>
    <div class="strokeActions"><button id="watch">▶ Watch</button><button id="retry">Start over</button></div>
  </div>
</div>

<script src="./consolidated-state.js?v=2.3.2"></script>
<script src="./consolidated-app.js?v=2.3.2"></script>
<script>
/* Visible brush overlay: does not intercept touches; Hanzi Writer still owns validation. */
(()=>{let active=null;function surfaceFromTarget(t){return t.closest?.('.canvas,.writeSurface')||null}function point(e,s){const r=s.getBoundingClientRect();return[(e.clientX-r.left),(e.clientY-r.top)]}function start(e){const s=surfaceFromTarget(e.target);if(!s)return;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('hanziBrushOverlay');const line=document.createElementNS('http://www.w3.org/2000/svg','polyline');svg.appendChild(line);s.appendChild(svg);const p=point(e,s);line.setAttribute('points',`${p[0]},${p[1]}`);active={id:e.pointerId,s,svg,line,pts:[p]}}function move(e){if(!active||active.id!==e.pointerId)return;const p=point(e,active.s);active.pts.push(p);active.line.setAttribute('points',active.pts.map(x=>x.join(',')).join(' '))}function end(e){if(!active||active.id!==e.pointerId)return;const a=active;active=null;setTimeout(()=>{a.svg.style.transition='opacity .12s ease';a.svg.style.opacity='0';setTimeout(()=>a.svg.remove(),130)},120)}document.addEventListener('pointerdown',start,true);document.addEventListener('pointermove',move,true);document.addEventListener('pointerup',end,true);document.addEventListener('pointercancel',end,true)})();
document.addEventListener('DOMContentLoaded',()=>setTimeout(()=>{const v=document.getElementById('buildVersion');if(v)v.textContent='CONSOLIDATED 2.3.2'},0))
</script>
</body>
</html>
